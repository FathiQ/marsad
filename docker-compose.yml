name: marsad

# Every toolchain Marsad needs lives in a container. Nothing is installed on the
# host. See docs/development.md.

services:
  # Go toolchain: build, test, lint. Plain upstream image, so the test loop never
  # waits on a rebuild.
  go:
    image: golang:1.25-bookworm
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false

  # Runs the backend against a real cluster. Carries the AWS CLI because EKS
  # kubeconfigs authenticate through an exec plugin that runs client-side.
  #
  # Both credential mounts are read-only, and Marsad only ever issues
  # get/list/watch — the mount makes that structurally true for the dev loop too.
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: marsad-dev
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - ${KUBECONFIG:-${HOME}/.kube/config}:/root/.kube/config:ro
      - ${HOME}/.aws:/root/.aws:ro
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
      KUBECONFIG: /root/.kube/config
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
    ports:
      - "8080:8080"

  # Node toolchain: Vite dev server, ESLint, Playwright.
  web:
    image: node:22-bookworm
    working_dir: /src/web
    volumes:
      - .:/src
      - web-node-modules:/src/web/node_modules
    ports:
      - "5173:5173"

  # Runs the backend against a local kind cluster.
  #
  # kind publishes its API server on 127.0.0.1, which a container cannot reach,
  # so this joins kind's own Docker network and uses the kubeconfig kind
  # generates for in-network clients (`kind get kubeconfig --internal`).
  #
  # A kind cluster with the ApplicationNetworkPolicy CRD installed exercises
  # every Marsad code path: Marsad reads declared policy through the API server
  # and never talks to the CNI, so enforcement being absent changes nothing.
  kind:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: marsad-dev
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
      KUBECONFIG: /src/.kube-kind.yaml
    networks:
      - kind
    ports:
      - "8080:8080"

  lint:
    image: golangci/golangci-lint:v2.12.2
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - golangci:/root/.cache/golangci-lint
    environment:
      GOFLAGS: -buildvcs=false

networks:
  # Created by kind itself; `make kind-up` ensures it exists.
  kind:
    external: true

volumes:
  go-mod:
  go-build:
  web-node-modules:
  golangci:
