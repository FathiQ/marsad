name: Build image

# Publishing is gated on human approval rather than on every push to a branch.
# A reviewer approving a pull request is the signal that its code is worth
# building an artifact from; ci.yml is what decides whether it is correct.
#
# Require the CI checks in branch protection. This workflow deliberately does
# not re-run them: gating the build on a green review keeps the two concerns
# separate, and a maintainer should not be able to publish an image from a pull
# request whose tests are failing.
on:
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build and publish
    # Reviews fire on every comment and every "changes requested"; only an
    # approval should produce an image.
    if: >-
      github.event_name != 'pull_request_review' ||
      github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # On an approval, build the commit that was actually reviewed rather
          # than the branch tip, which may have moved since.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # No QEMU step: nothing in the Dockerfile executes on the target
      # platform. Go cross-compiles from $BUILDPLATFORM, the web stage is
      # pinned to it, and the final distroless stage only copies a binary in.
      # Emulation would cost minutes to produce an identical image.
      - uses: docker/setup-buildx-action@v3

      # A fork's pull request must never publish, even once approved. The token
      # in this event context can write packages, and approving a change is a
      # judgement about the code, not a grant of push rights to the registry.
      # Fork builds still run — they just stop before the push.
      - name: Log in to the registry
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request_review' }}
            type=sha,format=long,prefix=sha-
          # `latest` moves only on a release tag. A branch build claiming it
          # would silently change what `docker pull marsad` gives people.
          flavor: |
            latest=${{ github.ref_type == 'tag' }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ !github.event.pull_request.head.repo.fork }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.pull_request.head.sha || github.sha }}
          # Off for the same reason as in the Makefile: with a manifest list
          # these attach a stray unknown/unknown entry that registries surface
          # as a phantom artifact. Vulnerability coverage comes from the
          # govulncheck job in ci.yml, which reads the module graph.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: Publish chart
    # Only on a release tag. The chart pins an appVersion, so publishing one
    # from a branch would ship a chart naming an image tag that moves under it.
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Derive the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Version and appVersion come from the tag rather than from Chart.yaml, so
      # a forgotten version bump cannot publish a chart that disagrees with the
      # release it was cut from. The appVersion is what the chart resolves the
      # image tag to, so this is also what keeps chart and image in step.
      - name: Package and push
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          helm package charts/marsad --version "$VERSION" --app-version "$VERSION"
          helm push "marsad-${VERSION}.tgz" "oci://ghcr.io/${owner}/charts"
          {
            echo "### Chart published"
            echo
            echo '```sh'
            echo "helm install marsad oci://ghcr.io/${owner}/charts/marsad --version ${VERSION} \\"
            echo "  --namespace marsad --create-namespace"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
