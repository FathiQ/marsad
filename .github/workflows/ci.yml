name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          # Take the newest patch rather than whatever the runner has baked in.
          # A stale preinstalled toolchain is how a patched stdlib vulnerability
          # shows up as a CI failure against code that is fine.
          check-latest: true
      - run: go build ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          # Take the newest patch rather than whatever the runner has baked in.
          # A stale preinstalled toolchain is how a patched stdlib vulnerability
          # shows up as a CI failure against code that is fine.
          check-latest: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          # Take the newest patch rather than whatever the runner has baked in.
          # A stale preinstalled toolchain is how a patched stdlib vulnerability
          # shows up as a CI failure against code that is fine.
          check-latest: true
      # The distroless image carries no OS packages, so registry scanners have
      # nothing to read. This checks the Go module graph instead.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src --max-warnings 0
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Smoke test against the built bundle with the API mocked, so it needs no
      # cluster and cannot be flaky for reasons outside the frontend.
      - run: npm run e2e

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          # Take the newest patch rather than whatever the runner has baked in.
          # A stale preinstalled toolchain is how a patched stdlib vulnerability
          # shows up as a CI failure against code that is fine.
          check-latest: true
      # A stale go.mod breaks reproducible builds for everyone downstream.
      - run: go mod tidy && git diff --exit-code go.mod go.sum

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/marsad
      # Render with the defaults and with the awkward combinations, so a
      # template that only breaks when a block is switched off fails here
      # rather than on someone's cluster.
      - run: helm template marsad charts/marsad > /dev/null
      - run: helm template marsad charts/marsad --set rbac.create=false --set serviceAccount.create=false > /dev/null
      - run: helm template marsad charts/marsad --set fullnameOverride=obs --set service.type=NodePort > /dev/null
      # The chart must stay read-only. Any verb outside get/list/watch in the
      # rendered ClusterRole is a bug in the chart, whatever the values say.
      - name: The ClusterRole grants reads only
        run: |
          verbs=$(helm template marsad charts/marsad \
            | awk '/kind: ClusterRole$/,/^---/' \
            | grep -oE 'verbs: \[[^]]*\]' | sort -u)
          echo "$verbs"
          if [ "$verbs" != "verbs: [get, list, watch]" ]; then
            echo "::error::the chart's ClusterRole grants something other than get/list/watch"
            exit 1
          fi
