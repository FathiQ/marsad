# A connection needs both halves. Deleting either policy below breaks it, and
# Marsad's Simulate panel names which half refused.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-ingress-from-web
  namespace: marsad-demo
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Both selectors in ONE peer: pods labelled app=web *in namespaces
        # labelled tier=edge*. Splitting these into two list items would mean
        # "any edge-namespace pod OR any web pod anywhere" — far broader.
        - namespaceSelector:
            matchLabels:
              tier: edge
          podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-allow-egress-to-api
  namespace: marsad-demo-edge
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              env: demo
          podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8080
