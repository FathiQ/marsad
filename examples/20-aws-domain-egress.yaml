# AWS VPC CNI domain-based egress. Requires the
# applicationnetworkpolicies.networking.k8s.aws CRD; without it, Marsad shows the
# "domain policies not available on this cluster" badge instead of guessing.
#
# ApplicationNetworkPolicy is an independent policy layer, not extra rules in the
# NetworkPolicy pool: the pod must satisfy both. Marsad shows each layer
# separately for exactly this reason.
#
# Note the DNS rule below. It looks redundant — 12-egress-dns.yaml already allows
# port 53 — but that allowance lives in the NetworkPolicy layer, and this policy
# constitutes a second layer that permits only 443. Because the layers combine by
# intersection, an ANP without its own DNS rule silently revokes name resolution,
# and a pod that cannot resolve *.s3.me-south-1.amazonaws.com cannot reach it
# either. Run Marsad against this file with and without the DNS rule to see the
# effective egress change.
apiVersion: networking.k8s.aws/v1alpha1
kind: ApplicationNetworkPolicy
metadata:
  name: api-allow-aws-services
  namespace: marsad-demo
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Egress
  egress:
    - to:
        # The wildcard matches one or more WHOLE labels, so this reaches
        # anything.s3.me-south-1.amazonaws.com at any depth — but not other
        # regions and not other AWS services.
        - domainNames:
            - "*.s3.me-south-1.amazonaws.com"
            - "sts.me-south-1.amazonaws.com"
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
