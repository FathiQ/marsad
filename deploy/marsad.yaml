# Plain manifests for Marsad. Apply rbac.yaml first.
#
# There is deliberately no Ingress and no authentication in v1: reach the
# dashboard with `kubectl port-forward`, which reuses the cluster's own authn
# and authz instead of inventing a second, weaker one.
#
#   kubectl apply -f deploy/
#   kubectl -n marsad port-forward svc/marsad 8080:80
#   open http://localhost:8080
apiVersion: v1
kind: Namespace
metadata:
  name: marsad
  labels:
    app.kubernetes.io/name: marsad
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marsad
  namespace: marsad
  labels:
    app.kubernetes.io/name: marsad
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marsad
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marsad
    spec:
      serviceAccountName: marsad
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: marsad
          image: marsad:latest
          args: ["-addr=:8080"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # The whole cluster's policy graph is held in memory. A few
              # thousand workloads fit comfortably; raise this for very large
              # clusters rather than letting it OOM-loop.
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: marsad
  namespace: marsad
  labels:
    app.kubernetes.io/name: marsad
spec:
  selector:
    app.kubernetes.io/name: marsad
  ports:
    - name: http
      port: 80
      targetPort: http
