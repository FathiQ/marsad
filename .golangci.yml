version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - goconst
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    revive:
      rules:
        # npeval is a published library: every exported symbol carries a doc
        # comment explaining the semantics it encodes.
        - name: exported
          arguments: [checkPrivateReceivers]
    goconst:
      min-occurrences: 4

  exclusions:
    rules:
      # Table-driven tests repeat literals by design.
      - path: _test\.go
        linters: [goconst, unparam, errcheck]

formatters:
  enable:
    - gofmt
